name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 依存に新しい脆弱性が見つかることがあるため、コードに変更がなくても週 1 回実行する
    - cron: "17 3 * * 1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EBITEN_APT_DEPS: >-
    libc6-dev libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev
    libxrandr-dev libxxf86vm-dev libasound2-dev pkg-config

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true # 標準ライブラリの脆弱性修正を含む最新の Go を使う（go.mod の go は下限）
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $EBITEN_APT_DEPS
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: govulncheck（ネイティブ）
        run: govulncheck ./...
      - name: govulncheck（ブラウザ WASM）
        run: GOOS=js GOARCH=wasm govulncheck ./...

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true # 標準ライブラリの脆弱性修正を含む最新の Go を使う（go.mod の go は下限）
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $EBITEN_APT_DEPS
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: go
          build-mode: autobuild
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:go
