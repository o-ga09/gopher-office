# ブラウザ版の静的配信。/v1 は API、/room はゲートウェイへ、前段の ingress が振り分ける
server {
  listen 8080;
  root /usr/share/nginx/html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types application/wasm application/javascript text/css;

  add_header X-Content-Type-Options nosniff always;

  location = /healthz {
    access_log off;
    return 200 "ok";
  }

  # 招待 URL（/w/{コード}）は、同じ HTML を返す。コードはログに残さない
  location /w/ {
    access_log off;
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
  }

  # ホーム（/home）も同じ HTML を返す
  location = /home {
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
  }

  location = /index.html { add_header Cache-Control "no-cache"; }
  # game.wasm は URL にバージョンが無いので、毎回 ETag で確認させる
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
}
